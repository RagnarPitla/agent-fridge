# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: No dependencies to install
        run: >
          node -e "const p=require('./package.json');
          const d=Object.keys(p.dependencies||{});
          if(d.length){console.error('unexpected runtime deps '+d.join(','));process.exit(1)}
          console.log('zero runtime dependencies confirmed')"

      - name: Lint (ASCII, parse, SPDX)
        run: npm run lint

      - name: Generated docs are in sync
        run: npm run gen:check

      - name: Unit and integration tests
        run: npm test

      - name: Concurrency tests (real processes)
        run: npm run test:concurrency

      - name: CLI smoke test
        run: node bin/fridge.mjs version --json

  go:
    name: go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: No module dependencies
        shell: bash
        run: |
          if grep -q '^require' go.mod; then
            echo "go.mod grew a require block; the standard library is the whole dependency tree"
            exit 1
          fi
          echo "zero module dependencies confirmed"

      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal vectors)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt clean"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: Build the binary
        run: go build -o fridge-ci ./cmd/fridge

      - name: Conformance vectors, embedded in the binary
        shell: bash
        run: ./fridge-ci conform

      - name: CLI smoke test
        shell: bash
        run: ./fridge-ci version --json

  parity:
    name: go and node agree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Both implementations pass the same vectors
        run: |
          go run ./cmd/fridge conform
          node bin/fridge.mjs conform

      - name: Replay every command through both implementations
        run: npm run parity

  crosscompile:
    name: six targets build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Cross-compile every published target
        run: node tools/go.mjs dist

      - name: Show what would ship
        run: ls -la dist/


  powershell:
    name: windows / powershell
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint
        run: npm run lint

      - name: Generated docs are in sync
        run: npm run gen:check

      - name: Full test suite
        run: npm run test:all

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Native binary on Windows
        run: |
          $ErrorActionPreference = 'Stop'
          go build -o fridge.exe ./cmd/fridge
          .\fridge.exe version
          .\fridge.exe conform
          if ($LASTEXITCODE -ne 0) { throw "conform failed with $LASTEXITCODE" }

      - name: Native binary exit-code contract, in PowerShell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-ps-native | Out-Null
          Set-Location ci-ps-native
          git init -q .
          $fridge = Join-Path $env:GITHUB_WORKSPACE 'fridge.exe'

          & $fridge init
          & $fridge join --agent alice --vendor human
          & $fridge claim "src/**" --task "native powershell check" --ttl 10m --agent alice
          if ($LASTEXITCODE -ne 0) { throw "claim should have succeeded, got $LASTEXITCODE" }

          & $fridge join --agent bob --vendor human
          & $fridge claim "src/api/routes.ts" --task "conflict" --agent bob
          if ($LASTEXITCODE -ne 10) { throw "expected exit 10 (E_CONFLICT), got $LASTEXITCODE" }

          & $fridge pin "native binary can pin notes too" --agent bob
          if ($LASTEXITCODE -ne 0) { throw "pin failed with $LASTEXITCODE" }

          # Nothing above rendered the door by hand. Every mutating command is
          # required to leave the derived view consistent on its own, so this
          # must be clean without an explicit render.
          & $fridge doctor --check
          if ($LASTEXITCODE -ne 0) { throw "doctor --check reported problems: $LASTEXITCODE" }

          & $fridge render
          if ($LASTEXITCODE -ne 0) { throw "render failed with $LASTEXITCODE" }

          & $fridge status --json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "status --json failed with $LASTEXITCODE" }
          Set-Location ..
          Write-Host 'native powershell exit-code contract holds'

      - name: Node and Go run Windows batch commands
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-run-windows | Out-Null
          Set-Location ci-run-windows
          git init -q .
          Set-Content -Path run-ok.cmd -Value "@echo off`r`necho batch-ok %1"
          $nodeFridge = Join-Path $env:GITHUB_WORKSPACE 'bin/fridge.mjs'
          $goFridge = Join-Path $env:GITHUB_WORKSPACE 'fridge.exe'

          node $nodeFridge init
          node $nodeFridge join --agent runner --vendor human
          node $nodeFridge run --agent runner --claim "node/**" --task "node batch" -- .\run-ok alpha
          if ($LASTEXITCODE -ne 0) { throw "Node batch command failed with $LASTEXITCODE" }
          node $nodeFridge run --agent runner --claim "node-missing/**" -- definitely-not-a-fridge-command
          if ($LASTEXITCODE -ne 127) { throw "Node missing command should return 127, got $LASTEXITCODE" }

          & $goFridge run --agent runner --claim "go/**" --task "go batch" -- .\run-ok beta
          if ($LASTEXITCODE -ne 0) { throw "Go batch command failed with $LASTEXITCODE" }
          & $goFridge run --agent runner --claim "go-missing/**" -- definitely-not-a-fridge-command
          if ($LASTEXITCODE -ne 127) { throw "Go missing command should return 127, got $LASTEXITCODE" }

          # Bare commands must follow PATH. A same-named file in the shared
          # checkout must not shadow the tool selected by the terminal.
          $trustedBin = Join-Path (Get-Location) 'trusted-bin'
          New-Item -ItemType Directory -Force -Path $trustedBin | Out-Null
          Set-Content -Path (Join-Path $trustedBin 'fridge-path-probe.cmd') -Value "@echo off`r`nexit /b 0"
          Set-Content -Path fridge-path-probe.cmd -Value "@echo off`r`nexit /b 23"
          $env:PATH = "$trustedBin;$env:PATH"

          node $nodeFridge run --agent runner --claim "node-path/**" -- fridge-path-probe
          if ($LASTEXITCODE -ne 0) { throw "Node preferred the checkout over PATH: $LASTEXITCODE" }
          & $goFridge run --agent runner --claim "go-path/**" -- fridge-path-probe
          if ($LASTEXITCODE -ne 0) { throw "Go preferred the checkout over PATH: $LASTEXITCODE" }

          Set-Location ..
          Write-Host 'Windows batch execution contract holds'

      - name: Quick start, in PowerShell, with PowerShell quoting
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-ps-workspace | Out-Null
          Set-Location ci-ps-workspace
          git init -q .
          $fridge = Join-Path $env:GITHUB_WORKSPACE 'bin/fridge.mjs'

          node $fridge init
          node $fridge join --agent alice --vendor human
          node $fridge claim "src/**" --task "powershell check" --ttl 10m --agent alice
          if ($LASTEXITCODE -ne 0) { throw "claim should have succeeded, got $LASTEXITCODE" }

          node $fridge join --agent bob --vendor human
          node $fridge claim "src/api/routes.ts" --task "conflict" --agent bob
          if ($LASTEXITCODE -ne 10) { throw "expected exit 10 (E_CONFLICT), got $LASTEXITCODE" }

          node $fridge check "src/api/routes.ts" --agent bob
          if ($LASTEXITCODE -ne 10) { throw "expected exit 10 from check, got $LASTEXITCODE" }

          node $fridge pin "powershell can pin notes too" --agent bob
          if ($LASTEXITCODE -ne 0) { throw "pin failed with $LASTEXITCODE" }

          node $fridge board
          node $fridge doctor --check
          if ($LASTEXITCODE -ne 0) { throw "doctor --check reported problems: $LASTEXITCODE" }
          Write-Host 'powershell exit-code contract holds'

  demo:
    name: launch demo proves no data loss
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the before/after demo
        run: npm run demo
      - name: Run the multi-process simulation
        run: |
          mkdir -p sim && cd sim && git init -q .
          node ../bin/fridge.mjs init
          node ../bin/fridge.mjs simulate --agents 6 --duration 20s --seed 1234

  # The install commands in the README are the first thing a stranger runs. They
  # were only ever verified by hand, and install.ps1 had never been executed on
  # Windows by anything. These run the published installers on their real
  # platforms, so a broken install surfaces here rather than in someone's
  # terminal. They test the latest published release on purpose: that is what a
  # clean machine actually gets today.
  install:
    name: published installer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/RagnarPitla/agent-fridge/releases/latest/download/install.sh \
            | sh -s -- --dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/fridge" version
          "$RUNNER_TEMP/bin/fridge" conform

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'bin'
          $script = Join-Path $env:RUNNER_TEMP 'install.ps1'
          Invoke-RestMethod https://github.com/RagnarPitla/agent-fridge/releases/latest/download/install.ps1 |
            Set-Content -Path $script
          & $script -Dir $dir
          & (Join-Path $dir 'fridge.exe') version
          & (Join-Path $dir 'fridge.exe') conform
          if ($LASTEXITCODE -ne 0) { throw "conform failed: $LASTEXITCODE" }
